options {
directory "/var/cache/bind";
listen-on { any; };
listen-on-v6 { none; };
allow-query { 192.168.26.0/24; 127.0.0.1; };
recursion yes;
allow-recursion { 192.168.26.0/24; 127.0.0.1; };
forwarders { 8.8.8.8; 1.1.1.1; };
dnssec-validation no;
};
zone "csne2026.test" {
type master;
file "/etc/bind/zones/db.csne2026.test";
};
